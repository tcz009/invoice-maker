<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Invoice Maker — Independent Contractor</title>
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3864'/%3E%3Cpath d='M9 7h9l5 5v13H9z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M12 17h8M12 21h5' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 3h9l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/>
        <path d="M14 3v5h5"/><path d="M8 13h8"/><path d="M8 17h5"/>
      </svg>
    </span>
    <div class="brand-text">
      <strong>Invoice Maker</strong>
      <span id="brandSub">Independent contractor · GBP</span>
    </div>
  </div>

  <div class="topbar-actions">
    <button type="button" class="btn" id="btnNew"><span class="lbl-long">New invoice</span><span class="lbl-short">New</span></button>
    <button type="button" class="btn" id="btnLibrary">Library<span class="count" id="libCount">1</span></button>
    <button type="button" class="btn" id="btnExport">Export</button>
    <button type="button" class="btn" id="btnImport">Import</button>
    <button type="button" class="btn btn-primary" id="btnPrint"><span class="lbl-long">Print / PDF</span><span class="lbl-short">PDF</span></button>
  </div>
</header>

<div class="workspace">
  <aside class="editor" id="editor" aria-label="Invoice fields">

    <section class="card">
      <h2>Contractor</h2>
      <div class="field">
        <label for="f-name">Contractor name</label>
        <input type="text" id="f-name" data-path="contractor.name" autocomplete="name" />
      </div>
      <div class="field">
        <label for="f-business">Business name <span class="opt">(if applicable)</span></label>
        <input type="text" id="f-business" data-path="contractor.business" />
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="f-email">Email</label>
          <input type="email" id="f-email" data-path="contractor.email" autocomplete="email" />
        </div>
        <div class="field">
          <label for="f-phone">Phone</label>
          <input type="tel" id="f-phone" data-path="contractor.phone" autocomplete="tel" />
        </div>
      </div>
      <div class="field">
        <label for="f-address">Address</label>
        <textarea id="f-address" data-path="contractor.address" rows="2"></textarea>
      </div>
      <div class="field">
        <label for="f-utr">UTR number</label>
        <input type="text" id="f-utr" data-path="contractor.utr" inputmode="numeric" />
      </div>
    </section>

    <section class="card">
      <h2>Invoice</h2>
      <div class="grid-2">
        <div class="field">
          <label for="f-number">Invoice number</label>
          <input type="text" id="f-number" data-path="number" spellcheck="false" />
        </div>
        <div class="field">
          <label for="f-status">Status <span class="opt">(tracking only)</span></label>
          <select id="f-status" data-path="status">
            <option value="draft">Draft</option>
            <option value="sent">Sent</option>
            <option value="paid">Paid</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="f-issue">Invoice date</label>
          <input type="date" id="f-issue" data-path="issueDate" />
        </div>
        <div class="field">
          <label for="f-due">Due date</label>
          <input type="date" id="f-due" data-path="dueDate" />
        </div>
      </div>
      <div class="field">
        <label for="f-duepreset">Due date rule</label>
        <select id="f-duepreset">
          <option value="eom">End of invoice month</option>
          <option value="receipt">Due on receipt</option>
          <option value="net14">14 days after invoice date</option>
          <option value="net30">30 days after invoice date</option>
          <option value="custom">Custom — set the date above</option>
        </select>
      </div>
      <div class="field">
        <label for="f-currency">Currency</label>
        <select id="f-currency" data-path="currency"></select>
      </div>
    </section>

    <section class="card">
      <h2>Services provided</h2>

      <div class="period">
        <div class="period-fields">
          <div class="field">
            <label for="f-period-from">Period from</label>
            <input type="date" id="f-period-from" data-path="period.from" />
          </div>
          <div class="field">
            <label for="f-period-to">Period to</label>
            <input type="date" id="f-period-to" data-path="period.to" />
          </div>
        </div>
        <button type="button" class="btn btn-sm btn-ghost" id="btnApplyPeriod">Apply period to line dates</button>
      </div>

      <div class="items" id="items"></div>

      <button type="button" class="btn btn-dashed" id="btnAddItem">＋ Add line</button>

      <div class="sum" id="editorTotal"></div>
    </section>

    <section class="card">
      <h2>Payment details</h2>
      <div class="grid-2">
        <div class="field">
          <label for="f-bank">Bank name</label>
          <input type="text" id="f-bank" data-path="payment.bank" />
        </div>
        <div class="field">
          <label for="f-holder">Account holder name</label>
          <input type="text" id="f-holder" data-path="payment.holder" />
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="f-account">Account number</label>
          <input type="text" id="f-account" data-path="payment.accountNumber" inputmode="numeric" />
        </div>
        <div class="field">
          <label for="f-sort">Sort code</label>
          <input type="text" id="f-sort" data-path="payment.sortCode" />
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Sign-off</h2>
      <div class="grid-2">
        <div class="field">
          <label for="f-signature">Signature</label>
          <input type="text" id="f-signature" data-path="signature" />
        </div>
        <div class="field">
          <label for="f-sigdate">Signature date</label>
          <input type="date" id="f-sigdate" data-path="signatureDate" />
        </div>
      </div>
      <div class="field">
        <label for="f-submission">Submission line</label>
        <input type="text" id="f-submission" data-path="submission" />
      </div>
      <div class="field">
        <label for="f-certification">Certification</label>
        <textarea id="f-certification" data-path="certification" rows="4"></textarea>
      </div>
    </section>

    <section class="card">
      <h2>Appearance</h2>
      <div class="field accent-field">
        <label for="f-accent">Accent colour</label>
        <div class="accent-row">
          <input type="color" id="f-accent" value="#1f3864" aria-label="Accent colour" />
          <div class="swatches" id="swatches">
            <button type="button" data-color="#1f3864" style="--c:#1f3864" aria-label="Navy"></button>
            <button type="button" data-color="#0f5132" style="--c:#0f5132" aria-label="Forest"></button>
            <button type="button" data-color="#7a1f2b" style="--c:#7a1f2b" aria-label="Burgundy"></button>
            <button type="button" data-color="#333333" style="--c:#333333" aria-label="Charcoal"></button>
            <button type="button" data-color="#0b5cad" style="--c:#0b5cad" aria-label="Blue"></button>
          </div>
        </div>
      </div>
      <p class="hint">Invoices are saved in this browser only. Use <strong>Print / PDF</strong> to send one.</p>
    </section>

    <p class="foot-note">Changes save automatically.</p>
  </aside>

  <main class="preview" id="preview">
    <div class="paper" id="paper"></div>
  </main>
</div>

<dialog id="libDlg" class="dialog" aria-label="Saved invoices">
  <div class="dialog-head">
    <h2>Saved invoices</h2>
    <button type="button" class="icon-btn" id="btnCloseLib" aria-label="Close">✕</button>
  </div>
  <div class="lib-list" id="libList"></div>
  <div class="dialog-foot">
    <button type="button" class="btn" id="btnLibNew">New invoice</button>
  </div>
</dialog>

<input type="file" id="importFile" accept="application/json,.json" hidden />
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<noscript><p class="noscript">This invoice maker needs JavaScript enabled.</p></noscript>
<script src="app.js"></script>
</body>
</html>
